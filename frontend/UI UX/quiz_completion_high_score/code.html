<style>

<script>
        // Micro-interaction: Confetti Effect
        function createConfetti() {
            const container = document.getElementById('confetti-container');
            const colors = ['#58cc02', '#2fb8ff', '#ff9c27', '#ffdcbf', '#87fe45'];
            
            for (let i = 0; i < 40; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = Math.random() * 2 + 's';
                confetti.style.top = '-20px';
                container.appendChild(confetti);
                
                // Cleanup
                setTimeout(() => confetti.remove(), 5000);
            }
        }

        // Trigger on load
        window.onload = createConfetti;
        
        // Tactile button sound placeholder (Visual feedback is handled via CSS)
        document.querySelectorAll('.tactile-button').forEach(button => {

<!DOCTYPE html>

<html class="light" lang="en"><head>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .tactile-card {
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .tactile-card:active {
            transform: translateY(4px);
            box-shadow: none !important;
        }
        .clay-border-green { border-bottom: 4px solid #1e5000; }
        .clay-border-blue { border-bottom: 4px solid #004666; }
        .clay-border-orange { border-bottom: 4px solid #6a3b00; }
        .clay-border-surface { border-bottom: 4px solid #dadada; }
        
        .shine-effect {
            position: relative;
            overflow: hidden;
        }
        .shine-effect::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.2), transparent);
            pointer-events: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface min-h-screen pb-24">
<!-- TopAppBar -->
<header class="bg-background fixed top-0 w-full z-50 h-16 flex justify-between items-center px-margin-mobile border-b-4 border-surface-container-highest">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full overflow-hidden border-2 border-primary-container bg-surface-container-high">
<img alt="Avatar" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAs7L2neoPnZFJQObf-qL5tuYjqXne5CFyVp0rWCUDTcLuHbTUxitpV_0VVin3MLygSiNSGAqtKGl9tXpQf_ZX-jaYIaK8Sd7jJDJUoEYfbhNZ2D_VHDw7gJX9JhkkkRBzA5gwrETJNoZ9C6wKTDHXITqHEfuOoWzCDTP7YZd6JI9azj3pffp-YYjip1DomPw5VhGEtUuFf31ghtRCOpjbkq_cY05-SXglfcnR7p7sQjX2EqQxUv7Q5YePprDBQ8P7Yx1Da4fp8kuk"/>
</div>
<div class="flex flex-col">
<span class="font-label-bold text-label-bold text-on-surface-variant">Halo, Pelajar!</span>
<span class="font-headline-md text-headline-md text-primary leading-tight">Learnly</span>
</div>
</div>
<div class="flex items-center gap-2 bg-surface-container-low px-3 py-1.5 rounded-full border-2 border-surface-container-highest">
<span class="material-symbols-outlined text-tertiary-container" style="font-variation-settings: 'FILL' 1;">stars</span>
<span class="font-label-bold text-label-bold text-on-surface">1,240 pts</span>
</div>
</header>
<!-- Main Content -->
<main class="pt-24 px-margin-mobile max-w-2xl mx-auto">
<div class="mb-8">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-2">Pilih Kelas Kamu</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Ayo mulai petualangan belajarmu hari ini!</p>
</div>
<!-- Grade Selection Bento Grid -->
<div class="grid grid-cols-2 gap-4">
<!-- Kelas 3 -->
<button class="tactile-card group relative flex flex-col items-center justify-center p-6 bg-white rounded-xl border-2 border-surface-container-highest clay-border-green h-48 w-full transition-all hover:bg-primary-container/5">
<div class="w-20 h-20 mb-4 rounded-full bg-primary-container/20 flex items-center justify-center group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-[48px] text-primary" data-icon="rocket_launch" style="font-variation-settings: 'FILL' 1;">rocket_launch</span>
</div>
<span class="font-headline-md text-headline-md text-on-surface">Kelas 3</span>
<div class="absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-primary">arrow_forward_ios</span>
</div>
</button>
<!-- Kelas 4 -->
<button class="tactile-card group relative flex flex-col items-center justify-center p-6 bg-white rounded-xl border-2 border-surface-container-highest clay-border-blue h-48 w-full transition-all hover:bg-secondary-container/5">
<div class="w-20 h-20 mb-4 rounded-full bg-secondary-container/20 flex items-center justify-center group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-[48px] text-secondary" data-icon="biotech" style="font-variation-settings: 'FILL' 1;">biotech</span>
</div>
<span class="font-headline-md text-headline-md text-on-surface">Kelas 4</span>
<div class="absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-secondary">arrow_forward_ios</span>
</div>
</button>
<!-- Kelas 5 -->
<button class="tactile-card group relative flex flex-col items-center justify-center p-6 bg-white rounded-xl border-2 border-surface-container-highest clay-border-orange h-48 w-full transition-all hover:bg-tertiary-container/5">
<div class="w-20 h-20 mb-4 rounded-full bg-tertiary-container/20 flex items-center justify-center group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-[48px] text-tertiary" data-icon="explore" style="font-variation-settings: 'FILL' 1;">explore</span>
</div>
<span class="font-headline-md text-headline-md text-on-surface">Kelas 5</span>
<div class="absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-tertiary">arrow_forward_ios</span>
</div>
</button>
<!-- Kelas 6 -->
<button class="tactile-card group relative flex flex-col items-center justify-center p-6 bg-white rounded-xl border-2 border-surface-container-highest clay-border-green h-48 w-full transition-all hover:bg-primary-container/5">
<div class="w-20 h-20 mb-4 rounded-full bg-primary-container/20 flex items-center justify-center group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-[48px] text-primary" data-icon="school" style="font-variation-settings: 'FILL' 1;">school</span>
</div>
<span class="font-headline-md text-headline-md text-on-surface">Kelas 6</span>
<div class="absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-primary">arrow_forward_ios</span>
</div>
</button>
</div>
<!-- Weekly Progress Card -->
<div class="mt-8 tactile-card bg-surface-container-lowest p-6 rounded-2xl border-2 border-surface-container-highest clay-border-surface">
<div class="flex justify-between items-center mb-4">
<h3 class="font-label-bold text-label-bold text-on-surface-variant">PROGRES MINGGU INI</h3>
<span class="text-primary font-label-bold text-label-bold">75%</span>
</div>
<div class="w-full bg-surface-container-highest h-4 rounded-full overflow-hidden shine-effect">
<div class="h-full bg-primary-container w-3/4 rounded-full transition-all duration-1000 ease-out"></div>
</div>
<p class="mt-4 font-body-md text-body-md text-on-surface-variant text-center">
                Selesaikan 2 materi lagi untuk mencapai target! 🎯
            </p>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full h-20 flex justify-around items-center px-4 pb-safe bg-surface-container-lowest border-t-4 border-surface-container-highest z-50">
<!-- Learn (Active) -->
<a class="flex flex-col items-center justify-center text-primary bg-primary-container/20 rounded-xl px-4 py-1 active:scale-95 transition-transform duration-100" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">school</span>
<span class="font-label-bold text-label-bold">Learn</span>
</a>
<!-- Leaderboard -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-95 duration-100" href="#">
<span class="material-symbols-outlined">emoji_events</span>
<span class="font-label-bold text-label-bold">Leaderboard</span>
</a>
<!-- Shop -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-95 duration-100" href="#">
<span class="material-symbols-outlined">shopping_bag</span>
<span class="font-label-bold text-label-bold">Shop</span>
</a>
<!-- Profile -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-95 duration-100" href="#">
<span class="material-symbols-outlined">person</span>
<span class="font-label-bold text-label-bold">Profile</span>
</a>
</nav>
<script>
        // Micro-interaction for cards
        document.querySelectorAll('.tactile-card').forEach(card => {
            card.addEventListener('click', function() {
                // Play subtle sound or haptic feedback simulation
                console.log('Class selected!');
                this.classList.add('scale-95');
                setTimeout(() => {
                    this.classList.remove('scale-95');
                }, 100);
            });
        });

        // Initialize progress bar animation
        window.addEventListener('load', () => {
            const progressBar = document.querySelector('.bg-primary-container');
            progressBar.style.width = '0%';
            setTimeout(() => {
                progressBar.style.width = '75%';
            }, 500);
        });
    </script>
</body></html>

<style>

    }
    .tactile-button-primary:active {
      box-shadow: 0 0px 0 #1e5000;
    }

    .tactile-button-secondary {
      @apply relative transition-all duration-75 active:translate-y-1;
      box-shadow: 0 4px 0 #004666;
    }
    .tactile-button-secondary:active {
      box-shadow: 0 0px 0 #004666;
    }

    .tactile-card {
      box-shadow: 0 4px 0 #e3e2e2;
    }

    .gummy-shine::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 5%;
      right: 5%;
      height: 30%;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 999px;
    }

    /* Animation for floating mascot */
    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(2deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    .animate-float {
      animation: float 4s ease-in-out infinite;
    }
  </style>

<!-- Interaction Script -->
<script>
    function toggleAuth(type) {
      const loginForm = document.getElementById('login-form');
      const registerForm = document.getElementById('register-form');
      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');

      if (type === 'login') {
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
        
        tabLogin.classList.add('bg-surface-container-lowest', 'text-primary', 'shadow-sm');
        tabLogin.classList.remove('text-on-surface-variant');
        
        tabRegister.classList.remove('bg-surface-container-lowest', 'text-primary', 'shadow-sm');
        tabRegister.classList.add('text-on-surface-variant');
      } else {
        loginForm.classList.add('hidden');
        registerForm.classList.remove('hidden');

        tabRegister.classList.add('bg-surface-container-lowest', 'text-primary', 'shadow-sm');
        tabRegister.classList.remove('text-on-surface-variant');

        tabLogin.classList.remove('bg-surface-container-lowest', 'text-primary', 'shadow-sm');
        tabLogin.classList.add('text-on-surface-variant');
      }
    }

    // Input Focus Visual Effects
    const inputs = document.querySelectorAll('input');
    inputs.forEach(input => {
      input.addEventListener('focus', () => {
        input.parentElement.parentElement.classList.add('scale-[1.01]');
        input.style.transition = 'all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1)';
      });
      input.addEventListener('blur', () => {
        input.parentElement.parentElement.classList.remove('scale-[1.01]');
      });
    });
  </script>

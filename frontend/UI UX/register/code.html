<style>

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

            transition: transform 0.1s, box-shadow 0.1s;

<body class="bg-background text-on-background min-h-screen flex flex-col items-center font-body-md selection:bg-primary-container selection:text-on-primary-container">
<!-- Ambient Background Elements -->
<div class="floating-orb bg-primary-container w-64 h-64 top-[-50px] left-[-100px]"></div>
<div class="floating-orb bg-secondary-container w-48 h-48 bottom-[10%] right-[-50px]"></div>
<main class="w-full max-w-md px-margin-mobile py-10 flex flex-col items-center">
<!-- Mascot Section -->
<div class="relative w-48 h-48 mb-8 group">
<div class="absolute inset-0 bg-secondary-container rounded-full scale-90 group-hover:scale-95 transition-transform duration-500"></div>
<img alt="Mascot" class="relative z-10 w-full h-full object-contain drop-shadow-xl animate-bounce" data-alt="A friendly, chunky 3D animated owl mascot with big expressive eyes and a tiny graduation cap. The character is rendered in a vibrant lime green and soft white color palette with bold outlines. It sits in a playful, welcoming pose against a soft-focus classroom background. The lighting is bright and cheerful, matching a kid-friendly educational app aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDpgFvT1y7_zrp1pBQWl0lthtYE7NmA2_EC_JN_gRJ1yby9GDBeaEhyPmrev9TlAp2ZO71_RGW_-KB49Jh2O4klwUuakfycqhnB4HICNx-LmRK7oYW7dsJOXvd-NiEiGaHdw2mStH7yoBS02_ExvJ3h-wOzK0auQqPeGwQhsMTBt-zLJneFsN0lUMMtB8t4pWfN8jldlxpxAzusi9ul1zotcHzcK3TeSIa3pG-ZUwHrjY6mjF2vO1A_pr0Ro6vv0WIIcetl29hnPb4o" style="animation-duration: 3s;"/>
</div>
<!-- Header -->
<header class="text-center mb-10">
<h1 class="font-display-lg text-display-lg text-primary mb-2">Daftar Akun Baru</h1>
<p class="font-body-lg text-body-lg text-outline">Ayo mulai petualangan belajarmu sekarang!</p>
</header>
<!-- Registration Form -->
<form class="w-full space-y-6" id="registrationForm">
<!-- Nama Lengkap -->
<div class="space-y-2">
<label class="font-label-lg text-label-lg text-on-surface ml-1" for="full_name">Nama Lengkap</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">person</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-lowest border-2 border-surface-container-highest border-b-4 border-b-surface-variant rounded-xl font-body-md text-on-surface focus:border-primary focus:border-b-primary focus:ring-0 transition-all chunky-input" id="full_name" name="full_name" placeholder="Masukkan nama lengkap" type="text"/>
</div>
</div>
<!-- Nama Pengguna -->
<div class="space-y-2">
<label class="font-label-lg text-label-lg text-on-surface ml-1" for="username">Nama Pengguna</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">alternate_email</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-lowest border-2 border-surface-container-highest border-b-4 border-b-surface-variant rounded-xl font-body-md text-on-surface focus:border-primary focus:border-b-primary focus:ring-0 transition-all chunky-input" id="username" name="username" placeholder="Pilih username unik" type="text"/>
</div>
</div>
<!-- Email -->
<div class="space-y-2">
<label class="font-label-lg text-label-lg text-on-surface ml-1" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-lowest border-2 border-surface-container-highest border-b-4 border-b-surface-variant rounded-xl font-body-md text-on-surface focus:border-primary focus:border-b-primary focus:ring-0 transition-all chunky-input" id="email" name="email" placeholder="contoh@email.com" type="email"/>
</div>
</div>
<!-- Kata Sandi -->
<div class="space-y-2">
<label class="font-label-lg text-label-lg text-on-surface ml-1" for="password">Kata Sandi</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-12 pr-12 py-4 bg-surface-container-lowest border-2 border-surface-container-highest border-b-4 border-b-surface-variant rounded-xl font-body-md text-on-surface focus:border-primary focus:border-b-primary focus:ring-0 transition-all chunky-input" id="password" name="password" placeholder="Minimal 8 karakter" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="passIcon">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full py-4 px-6 bg-primary-container text-on-primary-container font-headline-md text-headline-md rounded-2xl shadow-[0_4px_0_0_#46a302] hover:bg-opacity-90 active:translate-y-1 active:shadow-none transition-all flex items-center justify-center gap-2 chunky-button mt-4" type="submit">

</button>

<footer class="mt-12 text-center">
<p class="font-body-md text-body-md text-outline">
                Sudah punya akun? 
                <a class="text-primary font-bold hover:underline ml-1 inline-flex items-center gap-1 group" href="#">
                    Masuk
                    <span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">login</span>
</a>
</p>
</footer>

<div class="mt-10 px-4 text-center">
<p class="font-label-md text-label-md text-outline-variant leading-relaxed">
                Dengan mendaftar, kamu menyetujui <span class="underline cursor-pointer">Ketentuan Layanan</span> dan <span class="underline cursor-pointer">Kebijakan Privasi</span> kami.
            </p>
</div>
</main>
<script>
        // Password Visibility Toggle
        function togglePassword() {
            const passInput = document.getElementById('password');
            const passIcon = document.getElementById('passIcon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                passIcon.innerText = 'visibility_off';
            } else {
                passInput.type = 'password';
                passIcon.innerText = 'visibility';
            }
        }

        // Form Interaction Simulation
        document.getElementById('registrationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Memproses...';
            btn.classList.add('opacity-80');
            
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Berhasil!';
                btn.classList.remove('bg-primary-container');
                btn.classList.add('bg-secondary');
                btn.style.boxShadow = '0 4px 0 0 #004c6e';
                
                // Show a simple success notification or redirect
                console.log("Registration simulated successful");
            }, 1500);
        });

        // Add depth effect to input borders on focus
        const inputs = document.querySelectorAll('.chunky-input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.classList.add('scale-[1.01]');
                input.parentElement.parentElement.style.transition = 'transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1)';
            });
            input.addEventListener('blur', () => {
                input.parentElement.parentElement.classList.remove('scale-[1.01]');
            });
        });
    </script>
